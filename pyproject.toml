[project]
name = "timon"
version = "0.1.0"
description = "Timón — git for trading. Deterministic risk engine for an AI paper-trading agent team (Moomoo x Qoder challenge)."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
timon = "timon.cli:main"

[tool.setuptools]
packages = ["timon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
