<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Timón earned autonomy">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10" fill="none" stroke="#8a909c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Helvetica Neue", Arial, sans-serif; }
      .ink { fill: #191b21; }
      .body { fill: #4c515c; }
      .muted { fill: #6b707c; }
      .faint { fill: #9aa0ac; }
      .card { fill: #ffffff; stroke: #dfe3eb; stroke-width: 1.2; }
      .accent-card { fill: #ffffff; stroke: #cf5a32; stroke-width: 1.6; }
      .cap { font-size: 11px; fill: #6b707c; letter-spacing: .1em; }
      .stage { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #9aa0ac; letter-spacing: .08em; }
      .name { font-size: 30px; font-weight: 600; fill: #191b21; letter-spacing: -.02em; }
      .name-a { font-size: 30px; font-weight: 600; fill: #a8431f; letter-spacing: -.02em; }
      .dates { font-size: 14px; fill: #6b707c; }
      .row { font-size: 13.5px; fill: #4c515c; }
      .key { font-size: 10px; font-weight: 700; fill: #9aa0ac; letter-spacing: .11em; }
      .arrow { stroke: #8a909c; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f6f7fa"/>

  <text x="80" y="68" class="ink" style="font-size:34px;font-weight:600;letter-spacing:-.03em">Earned autonomy</text>
  <text x="80" y="100" class="muted" style="font-size:16px">Autonomy is granted in steps and can be taken back in one. Each step widens what the agent may do alone.</text>

  <!-- Stage 1 -->
  <rect x="80" y="150" width="420" height="350" rx="16" class="card"/>
  <text x="108" y="188" class="stage">STAGE 1</text>
  <text x="108" y="238" class="name">Human</text>
  <text x="108" y="264" class="dates">18–20 November</text>
  <rect x="108" y="286" width="364" height="1" fill="#e7eaf0"/>
  <text x="108" y="318" class="key">THE AGENT MAY</text>
  <text x="108" y="344" class="row">compute a plan and prepare orders</text>
  <text x="108" y="368" class="row">read data, write the ledger</text>
  <text x="108" y="404" class="key">THE HUMAN MUST</text>
  <text x="108" y="430" class="row">approve every order in Slack</text>
  <text x="108" y="454" class="row">watch the first cycles live</text>
  <rect x="108" y="472" width="240" height="18" rx="9" fill="#eef0f4"/>
  <text x="120" y="485" class="key" style="fill:#555b66">EVERY ORDER TO SLACK</text>

  <!-- Stage 2 -->
  <rect x="590" y="150" width="420" height="350" rx="16" class="card"/>
  <text x="618" y="188" class="stage">STAGE 2</text>
  <text x="618" y="238" class="name">Bounded</text>
  <text x="618" y="264" class="dates">23–24 November</text>
  <rect x="618" y="286" width="364" height="1" fill="#e7eaf0"/>
  <text x="618" y="318" class="key">THE AGENT MAY</text>
  <text x="618" y="344" class="row">place small orders without asking</text>
  <text x="618" y="368" class="row">exit anything, at any time</text>
  <text x="618" y="404" class="key">THE HUMAN MUST</text>
  <text x="618" y="430" class="row">approve anything above the small cap</text>
  <text x="618" y="454" class="row">review the ledger at the close</text>
  <rect x="618" y="472" width="240" height="18" rx="9" fill="#eef0f4"/>
  <text x="630" y="485" class="key" style="fill:#555b66">A FIXED RISK CAP</text>

  <!-- Stage 3 -->
  <rect x="1100" y="150" width="420" height="350" rx="16" class="accent-card"/>
  <text x="1128" y="188" class="stage" style="fill:#b8705a">STAGE 3</text>
  <text x="1128" y="238" class="name-a">Proven</text>
  <text x="1128" y="264" class="dates">25–27 November</text>
  <rect x="1128" y="286" width="364" height="1" fill="#f0e2dc"/>
  <text x="1128" y="318" class="key">THE AGENT MAY</text>
  <text x="1128" y="344" class="row">trade any size inside the limits</text>
  <text x="1128" y="368" class="row">run the full cycle unattended</text>
  <text x="1128" y="404" class="key">THE HUMAN MUST</text>
  <text x="1128" y="430" class="row">watch the daily report</text>
  <text x="1128" y="454" class="row">hold the off switch</text>
  <rect x="1128" y="472" width="240" height="18" rx="9" fill="#f8e7e0"/>
  <text x="1140" y="485" class="key" style="fill:#a8431f">THE DOCUMENTED LIMITS</text>

  <!-- Progression -->
  <path d="M510 325H580" class="arrow"/>
  <path d="M1020 325H1090" class="arrow"/>

  <!-- Criteria -->
  <text x="80" y="566" class="cap">WHAT EARNS THE NEXT STEP</text>
  <text x="80" y="596" class="row" style="font-size:15px">A run of clean cycles, no limit breach, the ledger verifying, and a human who has read the log.</text>
  <text x="80" y="622" class="row" style="font-size:15px">A single breach moves the system back a step. It does not negotiate.</text>

  <rect x="80" y="666" width="1440" height="1" fill="#dfe3eb"/>

  <text x="80" y="706" class="cap">WHAT NEVER CHANGES</text>
  <text x="80" y="740" class="row" style="font-size:15px">The risk limits, the order of operations and the fail-closed path are the same in all three stages.</text>
  <text x="80" y="764" class="row" style="font-size:15px">Autonomy changes who says yes, never what is allowed.</text>

  <text x="80" y="878" class="faint" style="font-size:12px">Stage 1 is the current stage on 17 November. Dates follow the competition calendar, not local time.</text>
</svg>
