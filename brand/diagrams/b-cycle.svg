<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Timón one cycle">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10" fill="none" stroke="#8a909c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10" fill="none" stroke="#cf5a32" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Helvetica Neue", Arial, sans-serif; }
      .ink { fill: #191b21; }
      .body { fill: #4c515c; }
      .muted { fill: #6b707c; }
      .faint { fill: #9aa0ac; }
      .card { fill: #ffffff; stroke: #dfe3eb; stroke-width: 1.2; }
      .accent-card { fill: #ffffff; stroke: #cf5a32; stroke-width: 1.6; }
      .dark-card { fill: #24272e; stroke: #24272e; }
      .arrow { stroke: #8a909c; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
      .arrow-a { stroke: #cf5a32; stroke-width: 1.6; fill: none; marker-end: url(#ar-a); }
      .stop { stroke: #b0453c; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
      .label { font-size: 12px; fill: #6b707c; letter-spacing: .02em; }
      .cap { font-size: 11px; fill: #6b707c; letter-spacing: .1em; }
      .title { font-size: 19px; font-weight: 600; fill: #191b21; letter-spacing: -.01em; }
      .title-w { font-size: 19px; font-weight: 600; fill: #ffffff; letter-spacing: -.01em; }
      .sub { font-size: 12.5px; fill: #6b707c; }
      .sub-w { font-size: 12.5px; fill: #b9bec8; }
      .num { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: #9aa0ac; }
      .pill { font-size: 9.5px; font-weight: 700; fill: #555b66; letter-spacing: .09em; }
      .pill-a { font-size: 9.5px; font-weight: 700; fill: #a8431f; letter-spacing: .09em; }
      .step { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #b6bcc6; font-weight: 600; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f6f7fa"/>

  <text x="80" y="68" class="ink" style="font-size:34px;font-weight:600;letter-spacing:-.03em">One cycle</text>
  <text x="80" y="100" class="muted" style="font-size:16px">Runs on a schedule. Exits before entries. Every step writes to the ledger.</text>

  <!-- Row 1 -->
  <g>
    <text x="92" y="176" class="step">01</text>
    <rect x="80" y="192" width="330" height="132" rx="14" class="card"/>
    <text x="104" y="230" class="title">Session</text>
    <text x="104" y="256" class="sub">open, holiday and cutoff checks</text>
    <text x="104" y="278" class="sub">a closed market ends the cycle</text>
    <text x="104" y="304" class="num">America/New_York</text>
  </g>

  <g>
    <text x="462" y="176" class="step">02</text>
    <rect x="450" y="192" width="330" height="132" rx="14" class="card"/>
    <text x="474" y="230" class="title">Kill switch</text>
    <text x="474" y="256" class="sub">day loss, drawdown from peak</text>
    <text x="474" y="278" class="sub">tripped means flatten and hold</text>
    <text x="474" y="304" class="num">checked before anything else</text>
  </g>

  <g>
    <text x="832" y="176" class="step">03</text>
    <rect x="820" y="192" width="330" height="132" rx="14" class="card"/>
    <text x="844" y="230" class="title">Exits</text>
    <text x="844" y="256" class="sub">stop, 2R target, time stop</text>
    <text x="844" y="278" class="sub">every open position, every cycle</text>
    <text x="844" y="304" class="num">no resting stops in the paper API</text>
  </g>

  <g>
    <text x="1202" y="176" class="step">04</text>
    <rect x="1190" y="192" width="330" height="132" rx="14" class="card"/>
    <text x="1214" y="230" class="title">Regime</text>
    <text x="1214" y="256" class="sub">RISK_ON, RISK_OFF or CHOP</text>
    <text x="1214" y="278" class="sub">sets size; missing data is CHOP</text>
    <text x="1214" y="304" class="num">SPY trend · VIX · breadth</text>
  </g>

  <!-- Row 2 -->
  <g>
    <text x="92" y="416" class="step">05</text>
    <rect x="80" y="432" width="330" height="132" rx="14" class="card"/>
    <text x="104" y="470" class="title">ORB signal</text>
    <text x="104" y="496" class="sub">first 30 minutes, then a break</text>
    <text x="104" y="518" class="sub">nine ETFs, long-only by default</text>
    <text x="104" y="544" class="num">no signal is a normal outcome</text>
  </g>

  <g>
    <text x="462" y="416" class="step">06</text>
    <rect x="450" y="432" width="330" height="132" rx="14" class="accent-card"/>
    <text x="474" y="470" class="title">Risk gate</text>
    <text x="474" y="496" class="sub">size, caps, daily counts, gaps</text>
    <text x="474" y="518" class="sub">deterministic; may only tighten</text>
    <rect x="474" y="530" width="92" height="18" rx="9" fill="#f8e7e0"/>
    <text x="484" y="543" class="pill-a">VERDICT</text>
  </g>

  <g>
    <text x="832" y="416" class="step">07</text>
    <rect x="820" y="432" width="330" height="132" rx="14" class="card"/>
    <text x="844" y="470" class="title">Orders</text>
    <text x="844" y="496" class="sub">exits, then approved entries</text>
    <text x="844" y="518" class="sub">SIMULATE account only</text>
    <text x="844" y="544" class="num">no match means no order</text>
  </g>

  <g>
    <text x="1202" y="416" class="step">08</text>
    <rect x="1190" y="432" width="330" height="132" rx="14" class="dark-card"/>
    <text x="1214" y="470" class="title-w">Commit</text>
    <text x="1214" y="496" class="sub-w">ledger entry, then git push</text>
    <text x="1214" y="518" class="sub-w">the dashboard redeploys</text>
    <text x="1214" y="544" class="num" style="fill:#8f96a3">append only · hash-chained</text>
  </g>

  <!-- Arrows -->
  <path d="M410 258H440" class="arrow"/>
  <path d="M780 258H810" class="arrow"/>
  <path d="M1150 258H1180" class="arrow"/>

  <path d="M410 498H440" class="arrow"/>
  <path d="M780 498H810" class="arrow"/>
  <path d="M1150 498H1180" class="arrow"/>

  <!-- Fail-closed branch -->
  <path d="M615 324V352" class="stop"/>
  <text x="474" y="378" class="label" style="fill:#b0453c">halt or stale data: log, commit, end the cycle</text>

  <text x="80" y="640" class="cap">ORDER OF OPERATIONS</text>
  <text x="80" y="666" class="body" style="font-size:15px">Exit orders are computed before entries, so risk is reduced before it is added.</text>
  <text x="80" y="690" class="body" style="font-size:15px">A step that fails does not fall through. It logs why and ends the cycle.</text>

  <rect x="80" y="726" width="1440" height="1" fill="#dfe3eb"/>
  <text x="80" y="764" class="cap">SAME INPUTS, SAME PLAN</text>
  <text x="80" y="792" class="body" style="font-size:15px">The engine is ordinary Python with tests. Given the same snapshot and the same config, it produces the same plan —</text>
  <text x="80" y="814" class="body" style="font-size:15px">which is why an agent can be replaced at any time without changing what the system does.</text>

  <text x="80" y="878" class="faint" style="font-size:12px">Competition account, SIMULATE only. Close every position before the bell; nothing survives the night.</text>
</svg>
